repos:
- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: 'v0.17.1'
  hooks:
      - id: ruff-check
      - id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.1.1
    hooks:
    -   id: mypy
-   repo: local
    hooks:
    -   id: elm-format
        name: elm-format
        entry: elm-format --yes
        language: system
        files: .*\.elm