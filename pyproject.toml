[project]
name = "aqimon"
version = "0.6.0"
description = "Air Quality Index Monitor"
authors = [{ name = "Tim Orme" }]
requires-python = ">=3.9,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.92.0,<0.93",
    "pyserial>=3.5,<4",
    "uvicorn>=0.21.0,<0.22",
    "databases[aiosqlite]>=0.7.0,<0.8",
    "fastapi-utils>=0.2.1,<0.3",
    "sds011lib>=0.4.0,<0.5",
]

[project.scripts]
aqimon = "aqimon.server:start"
aqimond = "aqimon.server:debug"

[dependency-groups]
dev = [
    "ruff==0.17.*",
    "mypy>=1.1.1,<2",
    "pytest>=7.3.1,<8",
    "pytest-asyncio>=0.21.0,<0.22",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-include = ["aqimon/static/elm.js"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
select = ["E", "F", "D"]
ignore = ["D203", "D213"]
line-length = 120

[tool.ruff.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104" ]  # We dont need docstrings in tests

[tool.black]
line-length = 120

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true
