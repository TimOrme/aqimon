[project]
name = "aqimon"
version = "0.6.0"
description = "Air Quality Index Monitor"
authors = [{ name = "Tim Orme" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi==0.162.*",
    "pyserial==3.5.*",
    "uvicorn==0.54.*",
    "databases[aiosqlite]==0.9.*",
    "sds011lib==0.5.*",
    "fastapi-utilities>=0.3.1",
]

[project.scripts]
aqimon = "aqimon.server:start"
aqimond = "aqimon.server:debug"

[dependency-groups]
dev = [
    "ruff==0.17.*",
    "mypy==2.*",
    "pytest==9.*",
    "pytest-asyncio==1.*",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-include = ["aqimon/static/elm.js"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104" ]  # We dont need docstrings in tests

[tool.black]
line-length = 120

[[tool.mypy.overrides]]
module = ["serial.*", "fastapi_utilities.*"]
ignore_missing_imports = true
